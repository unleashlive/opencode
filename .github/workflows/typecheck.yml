name: typecheck-lint

# PR quality gates for this fork, complementing parse-smoke.yml (which only
# catches Bun *parse* failures, not type errors — that's how the TS2741 in
# PR #45 slipped through).  Two jobs:
#
#   typecheck-ratchet — runs `tsgo --noEmit` on BOTH the PR head and the base
#     branch, and fails only on type errors the PR INTRODUCES.  A plain
#     `tsgo --noEmit` gate is impossible here: the fork carries ~20 pre-existing
#     TS errors (Drizzle drift, date/number mixups — see parse-smoke.yml) that
#     the runtime tolerates but tsgo rejects, so it would be red on day one.
#     The base-vs-head ratchet lets that debt through while catching anything
#     new.  No committed baseline to maintain — the base branch IS the baseline.
#
#   lint-changed — runs oxlint on the PR's changed .ts/.tsx files only, so a new
#     lint error fails the build without being blocked by (or needing a baseline
#     for) lint debt in files the PR didn't touch.
#
# Both run on GitHub-hosted ubuntu-latest (not the absent Blacksmith runners).

on:
  pull_request:
    branches: [collab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-ratchet:
    name: Typecheck (no new errors vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun + install deps
        uses: ./.github/actions/setup-bun

      - name: Collect type errors — PR head
        run: bash .github/scripts/collect-type-errors.sh > "$RUNNER_TEMP/head.txt"

      - name: Collect type errors — base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Collect the base baseline by checking BASE out IN PLACE in this same
          # working tree, then running the collection script here — NOT in a
          # detached `git worktree` with symlinked node_modules.  The worktree
          # approach (the original design) made `bun turbo typecheck` fast-fail
          # on the base: a linked worktree has a `.git` *file* (not dir) and a
          # symlinked node_modules, and turbo/tsgo produced zero task output
          # there, so the base baseline came back empty and the ratchet flagged
          # every real head error as "new".  Running in place reuses the exact
          # node_modules + tree head just typechecked against, so turbo behaves
          # identically for base and head.
          #
          # Copy head's (this PR's) collection script to a temp path BEFORE the
          # checkout, so we always run the up-to-date collector even when BASE
          # predates a fix to it.
          cp .github/scripts/collect-type-errors.sh "$RUNNER_TEMP/collect.sh"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach --force "$BASE_SHA"
          bash "$RUNNER_TEMP/collect.sh" > "$RUNNER_TEMP/base.txt"

      - name: Fail on NEW type errors
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          base_n=$(grep -c . "$RUNNER_TEMP/base.txt" || true)
          head_n=$(grep -c . "$RUNNER_TEMP/head.txt" || true)
          echo "type-error signatures — base: ${base_n}, head: ${head_n}"
          # Sanity gate: this fork carries ~20 known baseline TS errors, so the
          # base set is never legitimately empty while head has errors.  A base
          # count of 0 with a non-empty head almost always means the base
          # collection didn't actually run (tooling/setup failure) — fail with a
          # clear diagnostic instead of misreporting every head error as "new".
          if [ "$base_n" -eq 0 ] && [ "$head_n" -gt 0 ]; then
            echo "::error::Base produced 0 type-error signatures while head has ${head_n}. The base typecheck almost certainly failed to run (not a real diff) — inspect the 'Collect type errors — base' step log."
            exit 1
          fi
          new="$(comm -13 <(sort -u "$RUNNER_TEMP/base.txt") <(sort -u "$RUNNER_TEMP/head.txt") || true)"
          if [ -n "$new" ]; then
            echo "::error::This PR introduces NEW TypeScript errors not present on the base branch:"
            printf '%s\n' "$new" | sed 's/^/  ✗ /'
            echo ""
            echo "Run 'bun run typecheck' locally to reproduce. Fix the new errors before merging."
            exit 1
          fi
          echo "✅ No new TypeScript errors vs base."

      - name: Report (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Current type-error signatures on this ref:"
          sed 's/^/  • /' "$RUNNER_TEMP/head.txt" || true
          echo "(workflow_dispatch is informational only — no pass/fail)"

  lint-changed:
    name: Lint changed files (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun + install deps
        uses: ./.github/actions/setup-bun

      - name: oxlint changed TS/TSX
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Two-dot diff (base.sha vs HEAD) — compares the two trees directly,
          # so it needs only those two commits present (no merge-base history).
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed .ts/.tsx files — nothing to lint."
            exit 0
          fi
          printf 'Linting %d changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          bunx oxlint "${files[@]}"
